# Flare workspace. See docs/architecture.md and docs/engineering.md.
# Members are real packages with code and tests; add a crate when it has both.
[workspace]
resolver = "3"
members = [
    "apps/flare-cli",
    "apps/flare-desktop",
    "apps/flare-mcp",
    "crates/foundation/flare-core",
    "crates/foundation/flare-document",
    "crates/editing/flare-commands",
    "crates/editing/flare-history",
    "crates/editing/flare-editor",
    "crates/services/flare-storage",
    "crates/foundation/flare-eval",
    "crates/services/flare-render",
    "crates/presentation/flare-ui",
    "crates/adapters/flare-import",
    "crates/adapters/flare-export",
    "crates/services/flare-publish",
    "crates/adapters/flare-flash",
    "crates/services/flare-text",
    "crates/services/flare-audio",
    "crates/services/flare-runtime",
]
exclude = ["original"]
default-members = ["apps/flare-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "BSD-3-Clause"

[workspace.dependencies]
# ---- Internal packages: root owns all paths ----------------------------------
flare-core = { path = "crates/foundation/flare-core" }
flare-flash = { path = "crates/adapters/flare-flash" }
flare-export = { path = "crates/adapters/flare-export" }
flare-publish = { path = "crates/services/flare-publish" }
flare-import = { path = "crates/adapters/flare-import" }
flare-ui = { path = "crates/presentation/flare-ui" }
flare-render = { path = "crates/services/flare-render" }
flare-eval = { path = "crates/foundation/flare-eval" }
flare-storage = { path = "crates/services/flare-storage" }
flare-commands = { path = "crates/editing/flare-commands" }
flare-history = { path = "crates/editing/flare-history" }
flare-editor = { path = "crates/editing/flare-editor" }
flare-document = { path = "crates/foundation/flare-document" }
flare-text = { path = "crates/services/flare-text" }
flare-audio = { path = "crates/services/flare-audio" }
flare-runtime = { path = "crates/services/flare-runtime" }

# ---- Math and vector geometry ------------------------------------------------
glamx = { version = "0.3.1", default-features = false, features = ["std", "f64"] }
kurbo = "0.13.1"
# i_overlay = "9.1.0"       # Prototype: polygon booleans, not full merge drawing.
# lyon_tessellation = "1"   # Prototype: fill/stroke mesh path.
# tess2-rust: choose a verified release after the tessellation experiment.

# ---- Binary data and GPU memory layouts --------------------------------------
zerocopy = { version = "0.8.63", features = ["derive"] }
bytemuck = { version = "1.25", features = ["derive"] }
encase = "0.13.0"
half = "2"
# Do not enable glamx/encase blindly: check its underlying glam's encase version.

# ---- Serialization, identity and typed errors -------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"                 # v7/serde are enabled by the consuming member.
thiserror = "2"
anyhow = "1"               # Executable boundaries, not public library errors.

# ---- Persistence, compression and content identity --------------------------
rusqlite = { version = "0.41.1", default-features = false }
# flare-storage adds bundled/backup/blob/limits/hooks at its dependency site.
blake3 = "1"
tempfile = "3"
zstd = "0.13"
# lz4_flex / rkyv: transient/cache candidates only; add after measurement.

# ---- Flash/XML/archive interchange -------------------------------------------
quick-xml = { version = "0.42.0", default-features = false }
zip = { version = "9.1.3", default-features = false }
swf = "0.3.0"
# Enable only reviewed compression features in the format adapter.
# Ruffle swf/core/render packages are NOT guessed Git dependencies here.
# Choose and record one tested Ruffle revision during the runtime/format spike.

# ---- Image assets and font/layout adapters -----------------------------------
image = { version = "0.25.10", default-features = false }
png = "0.18.1"
parley = "0.12.0"
skrifa = "0.44.0"          # Glyph outlines for the text tool; one copy, shared with the rasterizer.
# usvg/resvg, lcms2, libmypaint, specialised codecs: add when a feature needs them.

# ---- GPU and desktop presentation: documented version family ----------------
wgpu = { version = "30.0", default-features = false }
egui = { version = "0.37.0", default-features = false }
egui_tiles = { version = "0.18.0", default-features = false }
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false }
winit = { version = "0.30.13", default-features = false }
rfd = "0.15.4"
pollster = "0.4.0"
muda = "0.21.2"          # Native menu bar (macOS); other platforms use the in-window menu.
# The desktop member must choose native backends/fonts/clipboard/platform features.
# Do not assume these minimal declarations alone build a desktop application.
# agg-rust = "1.2.0"        # CPU renderer experiment, not mandatory.
vello_cpu = { version = "0.3.0", features = ["multithreading"] } # Selected CPU rasterizer; see experiments/renderers/results/REPORT.md. Threads are opt-in per render.
# vello_gpu = "0.3.0"       # Verify published package and wgpu compatibility first.
# tiny-skia: reference/control candidate; no second default CPU engine yet.

# ---- CPU workers and asynchronous application services -----------------------
rayon = "1"
tokio = { version = "1", default-features = false }
# crossbeam-channel/rtrb: bounded communication only at justified boundaries.

# ---- Audio ---------------------------------------------------------------------
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "ogg", "vorbis", "flac", "pcm"] }
cpal = "0.16"
base64 = "0.22"

# ---- CLI, MCP and structured diagnostics -------------------------------------
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.8.0", default-features = false }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ---- Verification ------------------------------------------------------------
proptest = "1"
insta = { version = "1", features = ["json"] }
criterion = "0.7"
# cargo-fuzz, cargo-deny, cargo-about and Miri are tools, not app dependencies.

# ---- Deferred functionality: register exact versions when adopted -----------
# Audio resampling and lock-free queues (rubato, rtrb) and an optional FFmpeg adapter: when needed.
# Spatial/physics: parry2d-f64, parry3d-f64, rapier2d-f64; 3D physics deferred.
# Scripting: boa_engine candidate; plugins/Wasm host deferred.
# Collections/SIMD: smallvec, indexmap, slotmap, hashbrown, bumpalo, wide on evidence.
# No kiss3d/rend3 production engine dependency; no blanket game engine or ECS.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"

[workspace.metadata.flare]
product-focus = "modern-adobe-animate-first"
reference-archive = "original"
lockfile-policy = "Cargo.lock is generated by cargo and committed; builds and CI use --locked"

[profile.release]
lto = "thin"
codegen-units = 1
# Keep unwinding until every FFI/process boundary has an explicit policy.
# Avoid fast-math, target-cpu=native and global allocator changes by default.

# Keep the hot loops responsive in the default `cargo run`/`cargo test` profile: the rasterizer
# and the code around it are far too slow unoptimized to draw or test large documents. Debug
# information and overflow checks stay on; only the optimization level changes.
[profile.dev.package.flare-document]
opt-level = 2
[profile.dev.package.flare-commands]
opt-level = 2
[profile.dev.package.flare-history]
opt-level = 2
[profile.dev.package.flare-editor]
opt-level = 2
[profile.dev.package.flare-eval]
opt-level = 2
[profile.dev.package.flare-render]
opt-level = 2
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
