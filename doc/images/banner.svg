<svg xmlns="http://www.w3.org/2000/svg" width="663" height="400" viewBox="0 0 663 400" role="img" aria-label="Flare - Open-source Flash/Animate successor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2129"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <clipPath id="win"><rect x="20" y="20" width="623" height="360" rx="18"/></clipPath>
  </defs>

  <rect width="663" height="400" fill="transparent"/>
  <rect x="20" y="20" width="623" height="360" rx="18" fill="url(#bg)" stroke="#2c303a" stroke-width="1.5"/>

  <g clip-path="url(#win)">
    <rect x="20" y="20" width="623" height="36" fill="#171920"/>
  </g>
  <circle cx="44" cy="38" r="6" fill="#ff5f57"/>
  <circle cx="64" cy="38" r="6" fill="#febc2e"/>
  <circle cx="84" cy="38" r="6" fill="#28c840"/>
  <text x="331" y="43" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7d8594">Flare Startup</text>

  <!-- logo mark -->
  <g transform="translate(331 150)">
    <path d="M0 -62 L46 26 L0 6 L-46 26 Z" fill="url(#logo)"/>
    <path d="M0 -30 L18 6 L0 -2 L-18 6 Z" fill="#14161c" opacity="0.35"/>
  </g>

  <text x="331" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f2f4f8" letter-spacing="2">Flare</text>
  <text x="331" y="288" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9aa3b2">Open-source Flash/Animate successor</text>

  <!-- progress bar -->
  <rect x="181" y="318" width="300" height="6" rx="3" fill="#2a2e38"/>
  <rect x="181" y="318" width="210" height="6" rx="3" fill="url(#bar)"/>
  <text x="331" y="343" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7d8594">Loading workspace... v0.1 alpha</text>
</svg>
