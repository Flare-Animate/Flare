[package]
name = "flare-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
flare-animate.workspace = true
flare-i18n.workspace = true
flare-platform.workspace = true
flare-shell = { workspace = true, default-features = false }
flare-storage.workspace = true

[features]
# Test Movie plays inside the window, with Ruffle running in this process (see flare-shell).
default = ["ruffle"]
ruffle = ["flare-shell/ruffle"]
# A scripted run of the real window (scripts/gui_tests.sh). Off in every build a person uses.
autotest = ["flare-shell/autotest"]

[lints]
workspace = true

[package.metadata.generate-rpm]
name = "flare"
license = "BSD-3-Clause"
summary = "2D animation"
url = "https://github.com/Flare-Animate/Flare"
assets = [
    { source = "target/release/flare-desktop", dest = "/usr/bin/flare-desktop", mode = "755" },
    { source = "packaging/flare.desktop", dest = "/usr/share/applications/flare.desktop", mode = "644" },
    { source = "assets/flare-icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/flare.png", mode = "644" },
    { source = "packaging/flare.metainfo.xml", dest = "/usr/share/metainfo/io.github.Flare_Animate.Flare.metainfo.xml", mode = "644" },
    { source = "packaging/flare-mime.xml", dest = "/usr/share/mime/packages/flare.xml", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/flare/LICENSE", mode = "644", doc = true },
    { source = "packaging/FONT_LICENSES.txt", dest = "/usr/share/licenses/flare/FONT_LICENSES.txt", mode = "644", doc = true },
    { source = "packaging/MODEL_LICENSES.txt", dest = "/usr/share/licenses/flare/MODEL_LICENSES.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
glibc = ">= 2.35"
libgcc = "*"
alsa-lib = "*"
fontconfig = "*"
libX11 = "*"
libxcb = "*"
libxkbcommon = "*"
wayland-libs = "*"
"mesa-libEGL" = "*"
"mesa-libGL" = "*"
"vulkan-loader" = "*"
"xdg-desktop-portal" = "*"
"shared-mime-info" = "*"
"desktop-file-utils" = "*"
