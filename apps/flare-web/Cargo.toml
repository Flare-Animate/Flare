[package]
name = "flare-web"
description = "Flare in a browser tab, with the Animate workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/flare-web/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
flare-animate.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
flare-export.workspace = true
flare-publish.workspace = true
flare-runtime.workspace = true
js-sys.workspace = true
rfd.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlCanvasElement", "HtmlAnchorElement", "Element", "Storage", "Blob", "BlobPropertyBag", "Url", "console"] }
# Explicit browser backends: prefer WebGPU, retain WebGL where available.
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[lints]
workspace = true
