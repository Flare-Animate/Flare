[package]
name = "flare-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The Android app is a library the system loads: `NativeActivity` finds `libflare_android.so`
# by the name in the manifest, and hands it the screen and the lifecycle.
[lib]
name = "flare_android"
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
flare-animate.workspace = true
flare-platform.workspace = true
# The window shell without the Test Movie player (which is a whole Ruffle): the phone's first
# version draws in the editor and plays the timeline itself.
flare-shell = { workspace = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }

[lints]
workspace = true

# (Version name and code come from the workspace version; cargo-apk refuses them here.)
# Read by `cargo apk` (CI: .github/workflows/android.yml), which writes the packaged manifest from
# this table; apps/flare-android/AndroidManifest.xml is the same thing for a person reading it.
# ChromeOS (x86_64 or arm64) and other Android variants run the same APK: the window is
# resizable, and touch, keyboard, mouse and camera are all optional so none of them filters the
# app out of the store listing of a Chromebook or a tablet.
[package.metadata.android]
package = "org.flareanimate.flare"
apk_name = "Flare"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.faketouch"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera.autofocus"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.microphone"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.keyboard"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.type.pc"
required = false

[package.metadata.android.application]
label = "Flare"
theme = "@android:style/Theme.Material.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|navigation|screenSize|screenLayout|smallestScreenSize|uiMode|density"
resizeable_activity = true
exported = true
