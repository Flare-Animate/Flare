version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      egui:
        patterns: ["egui*", "eframe", "emath", "epaint*"]
      wgpu:
        patterns: ["wgpu*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
