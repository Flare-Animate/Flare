# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: iOS Build

on:
  push:
    branches: [main, Rust-Rewrite]
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_ios.yml'
  pull_request:
    branches: [main, Rust-Rewrite]
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_ios.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iOS:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: true
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for iOS
        run: |
          cargo build --target aarch64-apple-ios -p flare-desktop 2>&1 || \
          echo "iOS build not yet supported - stub"

      - name: Build Rust tests
        run: |
          cargo test --lib --manifest-path flare/sources/Cargo.toml 2>&1 || true