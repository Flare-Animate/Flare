name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless; runs on main
# are never cancelled, so every commit on main gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  checks:
    name: Format, lints and tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: checks

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # The scripts are platform independent; they run once.
      - name: The command line works end to end
        if: runner.os == 'Linux'
        run: |
          cargo build -p flare-cli --locked
          python3 -m unittest discover -s scripts/tests -p 'test_cli_smoke.py' -v

      - name: The registered file types are the ones the app opens
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -p 'test_associations.py' -v

      - name: The crate layers hold
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -p 'test_layers.py' -v

      - name: The manifests follow the workspace rules and the surfaces table is well formed
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_manifests.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_surfaces.py' -v

      - name: The lock file is up to date
        if: runner.os == 'Linux'
        run: cargo metadata --locked --format-version 1 > /dev/null

  web:
    name: The browser build compiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          linux-libs: 'false'
          cache-key: web
      - name: Lints for wasm32
        run: cargo clippy -p flare-web --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Every crate that should work in a page compiles for it
        run: |
          for crate in flare-core flare-document flare-eval flare-input flare-commands \
            flare-history flare-editor flare-tools flare-render flare-text flare-storage \
            flare-runtime flare-recent flare-dock flare-animate flare-publish flare-export flare-import; do
            cargo check -p "$crate" --target wasm32-unknown-unknown --locked
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: SQLite, zstd and Ruffle for the page (from npm, exact versions)
        working-directory: apps/flare-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: System libraries the command line is built with (the page's test builds it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libasound2-dev
      - name: The page reads and writes .flare files
        run: |
          cargo build -p flare-cli --locked
          python3 -m unittest discover -s scripts/tests -p 'test_web_flare_file.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_web_wasm.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_web_ruffle.py' -v

  audit:
    name: No known vulnerabilities in the dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Advisories about vulnerabilities fail this; "unmaintained" and "unsound" notes do not.
      - run: cargo audit

  docs:
    name: No file over 500 lines, no stray reference to scratch notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust files stay under 500 lines
        run: |
          long=$(find crates apps -name '*.rs' -not -path '*/target/*' -print0 \
            | xargs -0 wc -l | awk '$1 > 500 && $2 != "total" {print}')
          if [ -n "$long" ]; then echo "Files over 500 lines:"; echo "$long"; exit 1; fi
      - name: Committed docs never point at docs/temp
        run: |
          if grep -rn "docs/temp" --include='*.md' . --exclude-dir=original --exclude-dir=target --exclude-dir=.git --exclude=AGENTS.md; then
            echo "Committed docs refer to docs/temp"; exit 1
          fi
