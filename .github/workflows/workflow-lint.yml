# Lints the workflows themselves. Every other check in this repository checks Rust or the
# scripts; this one is what stops a typo in a job definition from wasting a full CI run.
name: Workflow Lint
on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint -color --config-file .github/actionlint.yml
