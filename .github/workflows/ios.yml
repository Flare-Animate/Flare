name: iOS

# There is no iOS app yet (no Xcode project, no UIKit lifecycle, no iOS file picker or storage
# in flare-platform). This job builds what exists: the shared window shell for aarch64-apple-ios,
# then wraps the desktop binary in an unsigned, experimental .ipa. A red job here is real
# information about the port, which is why it does not hold the branch back yet (docs/SURFACES.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ipa:
    name: Shell for iOS and experimental unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 90
    # First flight: the iOS target has not completed on a runner yet. Remove this line once it
    # is green on its own, so it holds the branch back like the other platforms.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios
          cache-key: ios
      # Without Ruffle in the process: the in-window Test Movie player is not built for a phone.
      - name: Build the shared window shell for iOS
        run: cargo build -p flare-shell --no-default-features --target aarch64-apple-ios --release --locked
      - name: Build the desktop binary for iOS
        run: cargo build -p flare-desktop --no-default-features --target aarch64-apple-ios --release --locked
      - name: Wrap the binary in an unsigned, experimental .ipa (not a supported app)
        run: |
          set -euo pipefail
          app=build/Payload/Flare.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/release/flare-desktop "$app/Flare"
          cp packaging/ios/Info.plist "$app/Info.plist"
          (cd build && zip -qry ../Flare-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: flare-ios-unsigned
          path: Flare-unsigned.ipa
          if-no-files-found: error
