name: iOS

# There is no iOS app yet (no Xcode project, no UIKit lifecycle, no iOS file picker or storage
# in flare-platform). This job builds what exists: the shared window shell for aarch64-apple-ios,
# then wraps the desktop binary in an unsigned, experimental .ipa. This is a build check, not an
# iOS app.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IPHONEOS_DEPLOYMENT_TARGET: "10.0"

jobs:
  ipa:
    name: Shell for iOS and experimental unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios
          cache-key: ios
      # Without Ruffle in the process: the in-window Test Movie player is not built for a phone.
      - name: Build the shared window shell for iOS
        run: |
          set -o pipefail
          cargo build -p flare-shell --no-default-features --target aarch64-apple-ios --release --locked 2>&1 | tee /tmp/flare_ios.log
      - name: Build the desktop binary for iOS
        run: |
          set -o pipefail
          cargo build -p flare-desktop --no-default-features --target aarch64-apple-ios --release --locked 2>&1 | tee -a /tmp/flare_ios.log
      - name: Wrap the binary in an unsigned, experimental .ipa (not a supported app)
        run: |
          set -euo pipefail
          app=build/Payload/Flare.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/release/flare-desktop "$app/Flare"
          cp packaging/ios/Info.plist "$app/Info.plist"
          (cd build && zip -qry ../Flare-unsigned.ipa Payload)
      # The runner log is unreadable without signing in; the build's tail is put into
      # annotations, which the public API serves, so the port's errors can be worked on.
      - name: Show the failure tail (annotations)
        if: failure()
        run: |
          tail -n 30 /tmp/flare_ios.log | tr -d '\r' | cut -c1-500 | sed 's/%/%25/g' | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error::${line}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flare-ios-unsigned
          path: Flare-unsigned.ipa
          if-no-files-found: error
