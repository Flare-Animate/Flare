# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Agentic — Auto-fix Build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose-build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false
          submodules: false
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up vcpkg (manual)
        shell: cmd
        run: |
          @echo on
          if exist vcpkg\bootstrap-vcpkg.bat (
            echo vcpkg already present
            goto :vcpkg_ready
          )
          if exist vcpkg (
            echo Removing stale vcpkg\n            rmdir /S /Q vcpkg
          )
          set CLONE_ATTEMPTS=0
          :clone_vcpkg
          set /A CLONE_ATTEMPTS+=1
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          if %ERRORLEVEL% EQU 0 goto :vcpkg_ready
          echo clone failed with %ERRORLEVEL% attempt %CLONE_ATTEMPTS%
          if %CLONE_ATTEMPTS% GEQ 3 (
            echo fallback to zip
            curl -fsSL -o vcpkg.zip https://github.com/microsoft/vcpkg/archive/refs/heads/master.zip
            7z x -y vcpkg.zip -ovcpkg_tmp
            move /Y vcpkg_tmp\vcpkg-master vcpkg
            rmdir /S /Q vcpkg_tmp
            del /Q vcpkg.zip
            goto :vcpkg_ready
          )
          timeout /t 3 /nobreak
          goto :clone_vcpkg
        :vcpkg_ready
          pushd vcpkg
          call bootstrap-vcpkg.bat || (echo bootstrap failed & exit /b 1)
          popd

      - name: Configure (CMake)
        shell: cmd
        run: |
          @echo on
          if exist build rmdir /S /Q build
          mkdir build
          cmake -S flare/sources -B build -G "Visual Studio 17 2022" -A x64 ^
            -DWITH_SYSTEM_LZO=ON ^
            -DWITH_LZODRIVER=OFF ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo > build\cmake_configure.log 2>&1
          if %ERRORLEVEL% NEQ 0 (
            type build\cmake_configure.log
            exit /b %ERRORLEVEL%
          )

      - name: Build (CMake)
        shell: cmd
        run: |
          @echo on
          cmake --build build --config RelWithDebInfo --target Flare --parallel 4 > build\build.log 2>&1
          set rc=%ERRORLEVEL%
          echo --- CMake configure log ---
          if exist build\cmake_configure.log type build\cmake_configure.log
          echo --- Build log ---
          if exist build\build.log type build\build.log
          if %rc% NEQ 0 (
            echo Build failed with exit code %rc%
            exit /b %rc%
          )

      - name: Upload build logs
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            build\CMakeCache.txt
            build\CMakeFiles\CMakeOutput.log
            build\CMakeFiles\CMakeError.log
            build\build.log
            build\cmake_configure.log

      - name: Post PR comment with logs (truncated)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            function readTrunc(path) {
              try {
                if (!fs.existsSync(path)) return '(missing)';
                const content = fs.readFileSync(path, 'utf8');
                if (content.length > 12000) return content.slice(0, 6000) + '\n\n... (truncated) ...\n\n' + content.slice(-6000);
                return content;
              } catch (e) { return `(error reading ${path}): ${e.message}`; }
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request.number;
            const cmake = readTrunc('build/cmake_configure.log');
            const build = readTrunc('build/build.log');
            const note = (!fs.existsSync('build/cmake_configure.log') && !fs.existsSync('build/build.log')) ? '\n\nNote: log files missing – checkout or prior step may have failed.' : '';
            const body = `Agentic build check completed — Windows\n\n--- CMake configure log ---\n${cmake}\n\n--- Build log ---\n${build}${note}`;
            await github.issues.createComment({ owner, repo, issue_number: pr, body });
