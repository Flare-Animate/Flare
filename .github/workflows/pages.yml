name: Web (GitHub Pages)

# Builds the browser app on every push and pull request; a push to main deploys it to GitHub
# Pages. The repository's Pages source must be "GitHub Actions" (a setting only the owner can make).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build the page
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          linux-libs: 'false'
          cache-key: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build apps/flare-web/dist
        run: sh apps/flare-web/scripts/build.sh
      # A site that builds but does not start (a panic at load, a blank canvas) must never deploy:
      # serve the artifact under /Flare/, as Pages does, and load it in headless Chromium.
      - name: Smoke test the built site
        run: |
          mkdir -p /tmp/serve && ln -sfn "$PWD/apps/flare-web/dist" /tmp/serve/Flare
          (cd /tmp/serve && python3 -m http.server 8099 >/dev/null 2>&1 &)
          sleep 1
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install chromium --with-deps
          node apps/flare-web/tests/web_smoke.mjs http://localhost:8099/Flare/ web-smoke.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/flare-web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
