name: pages
on:
  push:
    branches: [master]
    paths: [tools/flash/ts/**, tools/flash/webapp/**]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # stripTypeScriptTypes is still flagged experimental; the warning is noise
      # in a deploy log, not a failure.
      - run: |
          node --disable-warning=ExperimentalWarning tools/flash/webapp/build.test.ts
          node --disable-warning=ExperimentalWarning tools/flash/webapp/build.ts
          test -f tools/flash/webapp/dist/index.html
          test -f tools/flash/webapp/dist/app.js
      # deploy-pages resolves the deployment through the Pages API, which
      # configure-pages sets up. Without this step the upload succeeds and the
      # deploy then fails, which is exactly what was happening: the build and
      # upload steps were green and only `actions/deploy-pages@v4` was red.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with: { path: tools/flash/webapp/dist }
      - id: d
        uses: actions/deploy-pages@v4
