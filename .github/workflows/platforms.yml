name: Platform builds

# The desktop, command line and MCP packages for every target, each built natively on its own
# platform. It has no triggers of its own: release.yml (on a v* tag) and nightly.yml (daily) call
# it, so a nightly is built by exactly the steps a release is. Its artifacts are named after the
# version the caller passes, and only the caller publishes them.
on:
  workflow_call:
    inputs:
      version:
        description: Version the packages are named after (the caller has validated it)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: flare-desktop.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: flare-desktop.exe
          - os: macos-15
            target: aarch64-apple-darwin
            executable: flare-desktop
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: flare-desktop
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: flare-desktop
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: flare-desktop
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        env:
          CACHE_ON_FAILURE: 'true'
        with:
          key: release-gpu-${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Linux build and packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev libvulkan-dev desktop-file-utils shared-mime-info appstream patchelf file rpm libfuse2
      - name: Make Windows portable builds independent of the VC runtime installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Build release
        run: cargo build --locked --release -p flare-desktop -p flare-cli -p flare-mcp --target ${{ matrix.target }}
      - name: Install macOS DMG layout tool
        if: runner.os == 'macOS'
        run: python -m pip install dmgbuild==1.6.7
      - name: Package portable archives and macOS images
        run: python scripts/packaging/package_release.py package --version ${{ inputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - name: Package headless CLI
        run: python scripts/packaging/package_cli.py --version ${{ inputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/flare${{ runner.os == 'Windows' && '.exe' || '' }} --mcp-binary target/${{ matrix.target }}/release/flare-mcp${{ runner.os == 'Windows' && '.exe' || '' }} --output dist
      - uses: ./.github/actions/release-tools
        if: runner.os == 'Linux'
      - name: Package Linux installers
        if: runner.os == 'Linux'
        run: python scripts/packaging/package_linux.py --version ${{ inputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/flare-desktop --output dist
      - name: Package Flatpak
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends flatpak dbus-daemon
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          python scripts/packaging/package_flatpak.py --version ${{ inputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/flare-desktop --output dist
      - name: Install the Flatpak and check what is inside it
        if: runner.os == 'Linux'
        run: |
          flatpak install --user -y --noninteractive --bundle dist/*.flatpak
          flatpak run --command=sh io.github.Flare_Animate.Flare -c 'test -x /app/bin/flare-desktop && test -f /app/share/applications/io.github.Flare_Animate.Flare.desktop && test -f /app/share/mime/packages/io.github.Flare_Animate.Flare.xml'
          # The program starts inside the sandbox, with the runtime's libraries, and answers.
          flatpak run --command=flare-desktop io.github.Flare_Animate.Flare --version | grep -q '^flare-desktop '
      - name: Inspect Linux desktop integration and native packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          fail() { echo "inspect: $1"; exit 1; }
          desktop-file-validate packaging/flare.desktop || fail 'desktop-file-validate refuses the .desktop file'
          appstreamcli validate --no-net packaging/flare.metainfo.xml || fail 'appstreamcli refuses the metainfo file'
          dpkg-deb --info dist/*.deb || fail 'dpkg-deb refuses the .deb'
          dpkg-deb --contents dist/*.deb || fail 'dpkg-deb cannot list the .deb'
          rpm -qip dist/*.rpm || fail 'rpm refuses the .rpm'
          rpm -qlp dist/*.rpm || fail 'rpm cannot list the .rpm'
          # The file takes stderr as well, so an ldd that cannot read the program explains itself.
          ldd target/${{ matrix.target }}/release/flare-desktop > dependencies.txt 2>&1 || true
          cat dependencies.txt
          if grep -F 'not found' dependencies.txt; then
            fail 'the desktop program has unresolved libraries: the lines above say which'
          fi
          appimage=$(realpath dist/*.AppImage) || fail 'there is no AppImage in dist to look into'
          inspection=$(mktemp -d)
          cd "$inspection"
          "$appimage" --appimage-extract > /dev/null || fail 'the AppImage would not extract'
          test -x squashfs-root/usr/bin/flare-desktop || fail 'the extracted AppImage has no usr/bin/flare-desktop'
          test -f squashfs-root/usr/share/mime/packages/flare.xml || fail 'the extracted AppImage has no usr/share/mime/packages/flare.xml'
          # The AppImage must not carry the system's graphics stack: its copies on the build
          # machine are older than the ones a newer system's graphics driver is built against,
          # and a copy found first makes the window fail to open. The packaging puts no system
          # library in the AppDir at all (scripts/packaging/appimage.py), so this looks at the
          # whole extracted program and `|| true` keeps a missing directory from ending the step.
          graphics=$(find squashfs-root/usr \( -name 'libwayland*' -o -name 'libxcb*' -o -name 'libX11*' -o -name 'libxkbcommon*' -o -name 'libffi*' -o -name 'libEGL*' -o -name 'libGL*' -o -name 'libvulkan*' -o -name 'libdrm*' \) 2>/dev/null || true)
          if [ -n "$graphics" ]; then
            echo "the AppImage bundles libraries of the system's graphics stack:"
            echo "$graphics"
            fail 'the AppImage may not bundle the system graphics stack'
          fi
          # The packed program starts and answers, through the entry point an AppImage runs.
          squashfs-root/AppRun --version || fail 'the AppImage entry point did not answer'
          squashfs-root/AppRun --version | grep '^flare-desktop ' || fail 'the version line is not "flare-desktop ...": what the entry point answered is above'
      - name: Install WiX 5 for both Windows architectures
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2 --allow-roll-forward
      - name: Package Windows MSI
        if: runner.os == 'Windows'
        run: python scripts/packaging/package_windows.py --version ${{ inputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: flare-${{ inputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Windows'
        with:
          name: windows-installer-logs-${{ matrix.target }}
          path: msi-*.log
