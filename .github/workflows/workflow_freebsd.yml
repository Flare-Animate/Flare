# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: FreeBSD Build

on:
  push:
    branches: [main, Rust-Rewrite]
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_freebsd.yml'
  pull_request:
    branches: [main, Rust-Rewrite]
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_freebsd.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  FreeBSD:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Build Rust on FreeBSD
        uses: vmactions/freebsd-vm@v1.1.1
        with:
          usesh: true
          prepare: |
            pkg update -f
            pkg install -y rust
          run: |
            cd $GITHUB_WORKSPACE
            cargo build --manifest-path flare/sources/Cargo.toml 2>&1 || echo "Build attempted"
            cargo test --manifest-path flare/sources/Cargo.toml --lib 2>&1 || true