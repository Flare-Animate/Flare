# actionlint v1.7.7 (pinned in workflow-lint.yml) does not know two hosted runner labels that
# platforms.yml uses: macos-15-intel for the Intel macOS release build and windows-11-arm for
# the Windows on Arm one.
self-hosted-runner:
  labels:
    - macos-15-intel
    - windows-11-arm
paths:
  .github/workflows/**:
    ignore:
      - 'shellcheck reported issue in this script: SC.*'
