[package]
name = "flare-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
egui.workspace = true
egui-wgpu = { workspace = true, features = ["default", "winit"] }
egui-winit = { workspace = true, features = ["clipboard", "links", "x11", "wayland"] }
flare-animate.workspace = true
flare-i18n.workspace = true
flare-menubar.workspace = true
flare-document.workspace = true
flare-ui.workspace = true
flare-platform.workspace = true
flare-ruffle = { workspace = true, features = ["embedded"], optional = true }
flare-storage.workspace = true
pollster.workspace = true
winit = { workspace = true, features = ["default"] }

[features]
# Test Movie plays inside the window, with Ruffle running in this process. Without it, Test Movie
# starts a Ruffle program found through FLARE_RUFFLE or PATH.
default = ["ruffle"]
ruffle = ["dep:flare-ruffle"]
# A scripted run of the real window (scripts/gui_tests.sh): it opens a project, Test Movie, closes
# Test Movie, and quits, on timers. Off in every build a person uses.
autotest = ["ruffle"]

[target.'cfg(unix)'.dependencies]
flare-tablet.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# On a phone the event loop is the app's activity (see apps/flare-android); the feature makes
# winit build its android backend, which no desktop target needs.
winit = { workspace = true, features = ["android-native-activity"] }

[dev-dependencies]
flare-core.workspace = true
flare-publish.workspace = true

[lints]
workspace = true
