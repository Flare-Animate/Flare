[package]
name = "flare-ruffle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
flare-document.workspace = true
flare-publish.workspace = true
tempfile.workspace = true
thiserror.workspace = true

# Ruffle's own exporter, from the pinned checkout in third_party/ruffle. It draws a SWF with
# Ruffle's renderer on the GPU, so a test can compare Ruffle's picture of what we publish with
# ours. Off by default: it adds Ruffle's whole dependency tree and needs Java to build.
exporter = { workspace = true, optional = true }

# Ruffle running inside the app: its core drawing on a wgpu device we are given, and sound
# through the sound card. Needs Java to build, like render-check.
ruffle_core = { workspace = true, optional = true }
ruffle_render_wgpu = { workspace = true, optional = true }
ruffle_frontend_utils = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }

[features]
render-check = ["dep:exporter"]
embedded = ["dep:ruffle_core", "dep:ruffle_render_wgpu", "dep:ruffle_frontend_utils", "dep:futures-lite"]

[dev-dependencies]
pollster.workspace = true
ruffle_core.workspace = true
flare-audio.workspace = true
flare-core.workspace = true
flare-eval.workspace = true
flare-render.workspace = true
glamx.workspace = true
swf.workspace = true
clap.workspace = true
png.workspace = true

[lints]
workspace = true
