[package]
name = "flare-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
flare-core.workspace = true
flare-document.workspace = true
bytemuck.workspace = true
flare-eval.workspace = true
image = { workspace = true, features = ["bmp", "jpeg", "tga", "tiff", "webp", "qoi", "pnm", "ico", "exr", "hdr"] }
glamx.workspace = true
png.workspace = true
thiserror.workspace = true
vello_cpu.workspace = true

# Threads are native only: with the feature on, vello_cpu's default settings call
# available_parallelism().unwrap(), which panics on wasm32 and kept the web build from starting.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "render"
harness = false
