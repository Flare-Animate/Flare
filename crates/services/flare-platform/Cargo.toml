[package]
name = "flare-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rtrb.workspace = true
sys-locale.workspace = true
cpal.workspace = true
directories.workspace = true
flare-audio.workspace = true
flare-export.workspace = true
flare-video.workspace = true
flare-document.workspace = true
flare-publish.workspace = true
flare-ruffle.workspace = true
flare-runtime.workspace = true
flare-storage.workspace = true
tempfile.workspace = true
thiserror.workspace = true

# The pickers and message boxes: rfd's own backends cover the desktop and the browser's wasm
# side. Android and iOS have no rfd backend (rfd fails to compile there, with no empty one to
# fall back on), so on those the dialogs' code answers itself (see dialogs.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd.workspace = true

# The Dock icon of a program run outside an app bundle (see app_icon_macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["std", "NSData"] }
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSResponder", "NSImage"] }

[dev-dependencies]
flare-import.workspace = true
flare-core.workspace = true

[lints]
workspace = true
