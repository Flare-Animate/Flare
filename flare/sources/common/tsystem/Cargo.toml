[package]
name = "ac-package"
description = "Flare native document package (.acx): a ZIP of JSON parts and media files"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ac_package"
path = "ac_package.rs"

[dependencies]
ac-core.workspace = true
serde.workspace = true
serde_json.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
