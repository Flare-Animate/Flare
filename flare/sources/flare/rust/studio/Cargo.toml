[package]
name = "flare-studio"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Native Flare animation workspace"

[lib]
path = "lib.rs"

[[bin]]
name = "flare-studio"
path = "main.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "persistence", "x11", "wayland", "accesskit"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
rfd = "0.17"
tiny-skia = "0.11"
tempfile = "3"
ac-core = { git = "https://github.com/KMSDax/AnimationCraft", rev = "e3f25db0140ea24590184b117e928e35f5bc6302", features = ["retain-tween-curves"] }
ac-render = { git = "https://github.com/KMSDax/AnimationCraft", rev = "e3f25db0140ea24590184b117e928e35f5bc6302" }

[dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot", "eframe"] }

[[example]]
name = "studio_snapshot"
path = "snapshot.rs"

# Studio and the pinned ac-render use Flare's copy of the core (../../../flarelib, see its
# ORIGIN.md), one shared document type with Flare's timeline semantics.
[patch."https://github.com/KMSDax/AnimationCraft"]
ac-core = { path = "../../../flarelib" }
