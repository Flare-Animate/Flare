[package]
name = "flare-studio"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Native Flare animation workspace"

[lib]
path = "lib.rs"

[[bin]]
name = "flare-studio"
path = "main.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "persistence", "x11", "wayland", "accesskit"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
rfd = "0.17"
tiny-skia = "0.11"
tempfile = "3"
ac-core = { git = "https://github.com/KMSDax/AnimationCraft", rev = "e3aadad1c9cc6451f39746226123fd1021fd889a" }
ac-render = { git = "https://github.com/KMSDax/AnimationCraft", rev = "e3aadad1c9cc6451f39746226123fd1021fd889a" }

[dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot", "eframe"] }

[[example]]
name = "studio_snapshot"
path = "snapshot.rs"
