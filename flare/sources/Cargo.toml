# Rust crate manifest for the Flare backend rewrite.
#
# The crate is rooted here so that Rust modules can live beside the C++ they
# port (common/<subsystem>/rust/), mirroring the OpenToonz/Tahoma source tree.
# Only the crate scaffolding is here; every module sits with its subsystem.
[workspace]
members = [
    "flarelib", "tnztools", "remote",
    # wave 2: AnimationCraft crates, rooted in their OpenToonz-matching dirs
    "common/tvrender",     # ac-render
    "common/flash",        # ac-xfl
    "sound",               # ac-audio
    "common/expressions",  # ac-script
    "common/tsystem",      # ac-package
    "flare",               # ac-app (bin flare)
    "flareqt",             # ac-cli (bin flare-cli)
    "tnzext",              # minnamate-editor (egui, bin minnamate)
    "tcomposer",           # minnamate-cli
    "toonzqt",             # flare-studio (egui workspace: widgets/theme/chrome)
    "common/tvectorimage/pathops",  # vc-pathops (absorbed from vectorcraft)
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Flare-Animate/RustConversion-AnimateCraft"

[workspace.dependencies]
ac-core = { path = "flarelib" }
ac-render = { path = "common/tvrender" }
ac-script = { path = "common/expressions" }
ac-xfl = { path = "common/flash" }
ac-audio = { path = "sound" }
ac-package = { path = "common/tsystem" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
gif = "0.13"
png = "0.17"
# UNIFICATION_PLAN step 1 (see docs/DEP_SKEW_AUDIT.md): one pin per direct
# dependency the ac / mm / studio crates share, so the three UI codebases cannot
# drift apart. `egui`/`eframe`/`egui_extras` are the 0.36 migration target for
# ac-app (`flare`, still 0.29); they are declared here but not yet forced on it.
egui = "=0.36.2"
eframe = "=0.36.2"
egui_extras = "=0.36.2"
image = { version = "0.25", default-features = false }
zip = "2"
flate2 = "1"
roxmltree = "0.20"
usvg = "0.44"
resvg = "0.44"
rfd = "0.17"
dirs = "5"
effectcraft-effects = { git = "https://github.com/storytold/effectcraft", rev = "549e9d825132986d6167c1432cd3328efcbb0278" }
effectcraft-raster = { git = "https://github.com/storytold/effectcraft", rev = "549e9d825132986d6167c1432cd3328efcbb0278" }
effectcraft-keyframe = { git = "https://github.com/storytold/effectcraft", rev = "549e9d825132986d6167c1432cd3328efcbb0278" }
effectcraft-project = { git = "https://github.com/storytold/effectcraft", rev = "549e9d825132986d6167c1432cd3328efcbb0278" }
photocraft-psd = { git = "https://github.com/storytold/photocraft", branch = "main" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true

[package]
name = "flare_formats"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[lib]
name = "flare_formats"
path = "flare_formats.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
miniz_oxide = "0.9.1"
libc = "0.2"
roxmltree = "0.20"
serde_json = "1.0.151"
flate2 = "1"
regex = "1"

[patch."https://github.com/KMSDax/AnimationCraft"]
ac-core = { path = "flarelib" }
