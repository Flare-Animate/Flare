# Rust crate manifest for the Flare backend rewrite.
#
# The crate is rooted here so that Rust modules can live beside the C++ they
# port (common/<subsystem>/rust/), mirroring the OpenToonz/Tahoma source tree.
# Only the crate scaffolding is here; every module sits with its subsystem.
[workspace]
members = ["flarelib", "tnztools", "remote"]
exclude = ["flare/rust/studio"]  # needs private AnimationCraft git deps

[package]
name = "flare_formats"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[lib]
name = "flare_formats"
path = "flare_formats.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
miniz_oxide = "0.9.1"
roxmltree = "0.20"
serde_json = "1.0.151"

[patch."https://github.com/KMSDax/AnimationCraft"]
ac-core = { path = "flarelib" }
